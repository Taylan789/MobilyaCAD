name: MobilyaCAD AI Developer

on:
  push:
    branches:
      - dev/github-work
    paths:
      - .github/workflows/ai-developer.yml
  workflow_dispatch:
    inputs:
      task:
        description: "AI yazilimciya verilecek ek gorev / ana prompt"
        required: true
        type: string

permissions:
  contents: write
  pull-requests: write
  issues: write
  actions: write

concurrency:
  group: mobilyacad-ai-developer
  cancel-in-progress: false

jobs:
  ai-developer:
    name: OpenCode autonomous product development
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Guard development branch
        run: |
          if [ "${GITHUB_REF_NAME}" != "dev/github-work" ]; then
            echo "::error::MobilyaCAD AI Developer yalnızca dev/github-work dalında çalıştırılabilir."
            exit 1
          fi

      - name: Checkout development branch
        uses: actions/checkout@v4
        with:
          ref: dev/github-work
          fetch-depth: 0

      - name: Configure Git identity
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Run OpenCode with OpenRouter
        uses: anomalyco/opencode/github@latest
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          model: openrouter/openrouter/free
          use_github_token: true
          prompt: |
            You are the autonomous lead developer for MobilyaCAD. Implement real fixes,
            add regression tests, run checks, and commit only safe completed work.

            NON-NEGOTIABLE:
            - Work ONLY on dev/github-work. Stop if the checked-out branch differs.
            - Never modify, checkout, push to, merge into, or target main.
            - Never force-push, rewrite history, weaken tests, or claim unrun checks passed.
            - Read AI_COORDINATION.md first and respect its ownership boundaries.
            - Own non-frontend domain/engine/production calculations/tests/docs/CI only.
            - Never edit frontend/**. The UI agent owns that area.
            - Commit coherent changes to dev/github-work only.
            - Do not merge PRs.

            Inspect current HEAD, open PRs, recent Actions and QA findings. Prioritize
            demonstrably unclaimed domain/production tasks, including DOM-002 and the
            production report/export contract. Validate mm units, quantities, geometry,
            material usage, hardware totals and CNC operation reconciliation. Never invent
            machine standards or manufacturer-specific coordinates. Add regression tests
            for every fix, run relevant tests and report exact commit/test evidence.
            Continue with small tested vertical slices; avoid repeating checks on unchanged SHA.

            USER-SUPPLIED TASK:
            ${{ inputs.task }}

            CONTINUOUS MODE:
            This run was started by the user or chained from the previous successful run.
            Work one small, unclaimed, testable task only. If free-model/API quota is
            exhausted, stop honestly and do not use paid models. Avoid unnecessary repeated
            scans/builds. Finish with a concise evidence report.

  # Disabled until its first-run failure is diagnosed from job logs.
  integration-performance-agent:
    if: false
    name: OpenCode integration and performance specialist
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Guard and checkout development branch
        shell: bash
        run: |
          if [ "${GITHUB_REF_NAME}" != "dev/github-work" ]; then
            echo "::error::Entegrasyon agent'ı yalnızca dev/github-work tetiklemesinde çalışabilir."
            exit 1
          fi
      - uses: actions/checkout@v4
        with:
          ref: dev/github-work
          fetch-depth: 0
      - name: Create isolated agent branch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "agent/integration-performance-${GITHUB_RUN_ID}"
      - name: Run integration and performance agent
        uses: anomalyco/opencode/github@latest
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          model: openrouter/openrouter/free
          use_github_token: true
          prompt: |
            You are MobilyaCAD's independent Integration & Performance Specialist.
            You work in an isolated branch named agent/integration-performance-<run-id>.
            Your changes must be committed and pushed to that branch, then opened as a PR
            targeting dev/github-work. Never target or modify main. Do not merge your PR.

            FIRST: read AI_COORDINATION.md, inspect current HEAD, open PRs and latest CI.
            OWNERSHIP: do not edit frontend/** (UI agent owns it); do not edit domain/engine/
            production calculation source files owned by the product agent. You may add
            isolated integration/performance tests, benchmarks, profiling utilities and
            adapter-level fixes only where ownership is explicitly unclaimed. If a fix
            requires another agent's files, document a precise handoff instead of editing them.

            MISSION:
            1. Map the real data flow between 2D editor, 3D scene, furniture model,
               production report and JSON/CSV adapters.
            2. Find measurable performance bottlenecks: unnecessary React renders,
               expensive Three.js scene updates, repeated geometry/material allocation,
               oversized assets/chunks, avoidable calculations and memory retention.
            3. Establish reproducible baselines before optimizing. Do not invent performance
               numbers; record the exact command, environment and observed result.
            4. Add focused integration tests for serialization round trips, geometry fidelity,
               units and quantity consistency wherever the tests do not overlap active work.
            5. Prefer small, measurable changes with tests. Preserve behavior and public APIs.
            6. Run relevant tests/build/lint for touched areas. Never weaken tests or hide warnings.
            7. Review open PRs and avoid duplicating active tasks. If no safe unclaimed task
               exists, produce a concise evidence-based handoff and make no no-op commit.
            8. Commit only your isolated branch. Push it and open a PR against dev/github-work.
               Include baseline, before/after measurements if available, test results, changed
               files, risks and exact acceptance criteria.
            9. Never alter AI_COORDINATION.md to claim another agent's task. Update it only
               through a PR if a clearly owned coordination addition is necessary.

            SAFETY: no main branch writes, no force pushes, no automatic merges, no fabricated
            test outcomes, no unsupported CNC/machine standards.

      - name: Publish isolated branch and open PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          if [ "$(git rev-list --count "origin/dev/github-work..HEAD")" -eq 0 ]; then
            echo "Güvenli ve test edilmiş değişiklik yok; boş PR açılmadı."
            exit 0
          fi
          git push --set-upstream origin "agent/integration-performance-${GITHUB_RUN_ID}"
          gh pr create --repo "$REPOSITORY" --base dev/github-work \
            --head "agent/integration-performance-${GITHUB_RUN_ID}" \
            --title "Entegrasyon ve performans iyileştirmeleri" \
            --body "Otonom Entegrasyon ve Performans agent'ının izole çalışma dalı. Test ve ölçüm kanıtları PR açıklamasına eklenmelidir."

  continue-agent-loop:
    name: Queue next cloud agent run
    needs: ai-developer
    if: success()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Dispatch next bounded run on dev/github-work
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
        run: |
          gh workflow run ai-developer.yml --repo "$REPOSITORY" --ref dev/github-work \
            -f task="Continuous autonomous MobilyaCAD development: inspect current dev/github-work, coordination board, open PRs and recent CI. Pick one small, unclaimed task in your ownership, implement and test it, commit safely on dev/github-work only, never touch main, and report evidence. If quota is exhausted, stop without paid fallback."
