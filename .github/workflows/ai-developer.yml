name: MobilyaCAD AI Developer

on:
  workflow_dispatch:
    inputs:
      task:
        description: "AI yazilimciya verilecek ek gorev / ana prompt"
        required: true
        type: string

permissions:
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: mobilyacad-ai-developer
  cancel-in-progress: false

jobs:
  ai-developer:
    name: OpenCode autonomous development
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Guard development branch
        run: |
          if [ "${GITHUB_REF_NAME}" != "dev/github-work" ]; then
            echo "::error::MobilyaCAD AI Developer yalnızca dev/github-work dalında çalıştırılabilir. main ve diğer dallarda çalıştırma engellendi."
            exit 1
          fi

      - name: Checkout development branch
        uses: actions/checkout@v4
        with:
          ref: dev/github-work
          fetch-depth: 0

      - name: Configure Git identity
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Run OpenCode with OpenRouter
        uses: anomalyco/opencode/github@latest
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          model: openrouter/openrouter/free
          use_github_token: true
          prompt: |
            You are the autonomous lead developer and quality-improvement engineer for MobilyaCAD.
            Your job is not merely to report problems: inspect the repository, implement real fixes,
            add meaningful automated tests, run the checks, and commit working changes to the
            current development branch.

            NON-NEGOTIABLE BRANCH AND SAFETY RULES:
            - Work ONLY on dev/github-work. Stop immediately if the checked-out branch differs.
            - Never checkout, commit to, merge into, push to, or open a pull request targeting main.
            - Never modify main, deploy to production, change repository settings/secrets, or rewrite history.
            - Do not force-push, delete branches, or bypass failing checks.
            - Commit completed changes to dev/github-work only. Do not claim a task is complete if it is only documented.
            - Do not fabricate test results. Clearly report blockers, failed checks, and unfinished work.

            WORKSPACE/PATH RULES:
            - The repository root is the current working directory (GITHUB_WORKSPACE).
            - The frontend project is in the relative directory "frontend".
            - Always use paths relative to the repository root.
            - Never manually construct absolute paths such as "/home/runner/work/...".
            - Do not access paths outside GITHUB_WORKSPACE and do not request external_directory permission.
            - If a file operation fails, inspect the current directory with "pwd" and "ls" and correct the relative path.

            PERSISTENT ENGINEERING MISSION — CONTINUE UNTIL DONE:
            1. Read the project structure, README/project instructions, existing source code, tests,
               recent commits, and the latest MobilyaCAD QA & Test results before making changes.
            2. Treat QA failures and uncovered production-critical paths as engineering tasks:
               diagnose the root cause, fix the implementation, add regression tests, and rerun QA.
            3. Expand the automated test suite beyond basic measurement tests to cover the actual
               furniture-production pipeline: cabinet geometry, cabinet parts, furniture calculators,
               hardware quantities, CNC operation generation, cut-list aggregation, CSV/JSON exports,
               edge banding, material usage, and invalid/impossible dimensions.
            4. Specifically investigate and fix these known review risks where they still exist:
               - Shelf-count consistency: generated shelf parts and CNC shelf-pin operations must use
                 the same effective shelf count, including furniture-level overrides.
               - CNC operation totals: displayed/exported operation counts must account for each
                 part's quantity, not only the operations on one representative part.
               - Desk/table CNC coverage: verify table-top and leg/joint machining is generated where
                 the construction model supports it; do not silently omit parts because of name mismatch.
               - CNC export fidelity: CSV and JSON production exports should preserve relevant CNC
                 operation data and quantities, with stable, documented field names.
               - Hinge placement: validate operation count, spacing, edge offsets, small/large doors,
                 and configurable or standards-based placement; avoid unsafe hard-coded assumptions.
               - Minifix/dowel positions: test dimensions, panel orientation, edge distances, collision
                 and consistency with hardware quantities. If a manufacturing standard is unknown,
                 expose/document a configurable rule rather than inventing one.
               - Hardware/CNC reconciliation: totals for hinges, shelf pins, minifix and dowels must
                 reconcile with generated operations and part quantities.
            5. For every bug fixed, add a regression test that fails before the fix and passes afterward.
               Include boundary cases, zero/negative/non-finite inputs, small parts, multiple quantities,
               multiple furniture instances, and differing furniture/rule settings where relevant.
            6. Review the current tests themselves. Remove brittle tests, correct false assumptions,
               and avoid tests that merely assert implementation details without validating production behavior.
            7. Run, from frontend: npm ci (when needed), npm test, npm run lint, and npm run build.
               Fix failures caused by your changes. Also run a dependency security audit and report
               existing vulnerabilities separately from newly introduced ones.
            8. Inspect generated cut lists and CNC operations end-to-end using realistic sample
               furniture configurations. Validate units (millimetres), quantity semantics, rounding,
               and data consistency across UI, calculations, and exports.
            9. Keep documentation and AI_PROGRESS.md up to date with completed work, test counts,
               known limitations, assumptions requiring human/manufacturing validation, and next tasks.
            10. Work in small, coherent commits. At the end, summarize commit hashes, files changed,
                actual test/build/lint/audit outcomes, known remaining risks, and exact next steps.

            IMPLEMENTATION QUALITY RULES:
            - Preserve existing public APIs and UI behavior unless a correction requires a deliberate change.
            - Prefer shared calculation helpers and typed models over duplicated formulas.
            - Do not introduce fake sample results into production paths.
            - Do not invent CNC machine standards, drilling coordinates, hardware dimensions, or safety margins.
              Where manufacturer-specific information is absent, make parameters explicit/configurable and
              clearly mark the output as requiring machine/operator validation.
            - Avoid unrelated redesigns and dependency upgrades unless required for the task.
            - Never weaken, skip, or remove tests/checks just to obtain a green workflow.
            - If a task is too large for one run, prioritize correctness and regression coverage, commit
              the completed safe subset, and write a precise continuation plan.

            USER-SUPPLIED TASK FOR THIS RUN:
            ${{ inputs.task }}
