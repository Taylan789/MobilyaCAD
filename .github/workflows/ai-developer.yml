name: MobilyaCAD AI Developer

on:
  workflow_dispatch:
    inputs:
      task:
        description: "AI yazilimciya verilecek ek gorev / ana prompt"
        required: true
        type: string

permissions:
  contents: write
  pull-requests: write
  issues: write
  actions: write

concurrency:
  group: mobilyacad-ai-developer
  cancel-in-progress: false

jobs:
  ai-developer:
    name: OpenCode autonomous product development
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Guard development branch
        run: |
          if [ "${GITHUB_REF_NAME}" != "dev/github-work" ]; then
            echo "::error::MobilyaCAD AI Developer yalnızca dev/github-work dalında çalıştırılabilir."
            exit 1
          fi

      - name: Checkout development branch
        uses: actions/checkout@v4
        with:
          ref: dev/github-work
          fetch-depth: 0

      - name: Configure Git identity
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Run OpenCode with OpenRouter
        uses: anomalyco/opencode/github@latest
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          model: openrouter/openrouter/free
          use_github_token: true
          prompt: |
            You are the autonomous lead developer for MobilyaCAD. Deliver one real,
            small, tested vertical slice per run. A report alone is not a completed task.

            SAFETY:
            - Start from dev/github-work; never modify, push to, merge into, or target main.
            - Read AI_COORDINATION.md and respect ownership boundaries.
            - Never force-push, rewrite history, weaken tests or claim checks not run.
            - No paid model fallback. If free model quota is unavailable, stop clearly.
            - Do not merge PRs.

            BRANCH/DELIVERY (IMPORTANT):
            - Do NOT commit directly to dev/github-work.
            - Create a unique branch from dev/github-work, e.g. agent/product-<task-slug>-<run-id>.
            - Make coherent changes, add regression tests, run relevant checks.
            - Commit completed changes on that branch, push it, and OPEN a PR targeting dev/github-work.
            - Do not leave work only in an unpushed local branch.
            - PR description must list files changed, tests/checks actually run, results,
              remaining risks, and acceptance evidence.
            - If no code change is justified, do not create an empty commit/PR; explain why.

            OWNERSHIP:
            - Own non-frontend domain/engine/production calculations/tests/docs/CI only.
            - Never edit frontend/**; the UI agent owns that area.
            - Avoid overlapping active PRs and tasks in AI_COORDINATION.md.

            Inspect current dev/github-work, open PRs, recent Actions and QA findings.
            Prioritize unclaimed domain/production tasks including DOM-002 and production
            report/export contracts. Validate mm units, quantities, geometry, material usage,
            hardware totals and CNC operation reconciliation. Never invent machine standards
            or manufacturer coordinates. Continue with one small testable slice only.

            USER TASK:
            ${{ inputs.task }}

  # Disabled pending separate diagnosis of the action's release lookup failure.
  integration-performance-agent:
    if: false
    name: OpenCode integration and performance specialist
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Disabled safely
        run: echo "Integration/performance specialist is disabled until its action setup failure is fixed."

  continue-agent-loop:
    name: Queue next bounded agent run
    needs: ai-developer
    if: success()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Dispatch next run only after agent job succeeds
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
        run: |
          gh workflow run ai-developer.yml --repo "$REPOSITORY" --ref dev/github-work \
            -f task="Continue autonomous development safely: inspect dev/github-work, coordination board, open PRs, and recent CI. Pick one small unclaimed task owned by the product agent. Create a unique branch from dev/github-work, implement and test, commit, push, and open a PR targeting dev/github-work. Never touch main or merge. Free-model quota exhaustion means stop without paid fallback. Report verifiable evidence."
