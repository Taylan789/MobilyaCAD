name: MobilyaCAD AI Developer

on:
  workflow_dispatch:
    inputs:
      task:
        description: "AI yazilimciya verilecek gorev / ana prompt"
        required: true
        type: string

permissions:
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: mobilyacad-ai-developer
  cancel-in-progress: false

jobs:
  ai-developer:
    name: OpenCode autonomous development
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Checkout selected branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0

      - name: Configure Git identity
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Run OpenCode with OpenRouter
        uses: anomalyco/opencode/github@latest
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          model: openrouter/openrouter/free
          use_github_token: true
          prompt: |
            You are working in the MobilyaCAD repository.
            Follow repository instructions and inspect the existing code before editing.
            IMPORTANT WORKSPACE/PATH RULES:
            - The repository root is the current working directory (GITHUB_WORKSPACE).
            - The frontend project is in the relative directory "frontend".
            - Always use paths relative to the repository root, for example "frontend/src/types/placedFurniture.ts".
            - Never manually construct absolute paths such as "/home/runner/work/...".
            - Do not access paths outside GITHUB_WORKSPACE and do not request external_directory permission.
            - If a file operation fails, inspect the current directory with "pwd" and "ls" and correct the relative path; do not retry using a guessed absolute path.
            Work on the branch selected for this workflow run. Do not force-push, delete branches,
            rewrite history, or modify repository secrets/settings.
            Implement the user's task thoroughly, run the available build, lint and tests,
            fix issues introduced by your changes, and summarize exactly what was completed
            and what remains. Do not claim tests passed unless they actually passed.

            USER TASK:
            ${{ inputs.task }}
