name: Deploy MobilyaCAD test site

on:
  push:
    branches:
      - dev/github-work
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Build site
        working-directory: frontend
        env:
          GITHUB_PAGES: "true"
        run: npm run build

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist

  verify:
    name: Require CI and QA success for this SHA
    runs-on: ubuntu-latest
    permissions:
      actions: read
    steps:
      - name: Wait for exact-commit CI and QA
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          node <<'NODE'
          const required = { CI: 417991874, QA: 419079561 };
          const deadline = Date.now() + 20 * 60 * 1000;
          const passed = new Map()
          async function fetchRuns() {
            const response = await fetch('https://api.github.com/repos/' + process.env.REPOSITORY + '/actions/runs?head_sha=' + process.env.SHA + '&per_page=100', {
              headers: { authorization: 'Bearer ' + process.env.GH_TOKEN, accept: 'application/vnd.github+json' }
            })
            if (!response.ok) {
              console.error('Actions API error: ' + response.status + ' ' + response.statusText)
              process.exit(1)
            }
            return (await response.json()).workflow_runs
          }
          while (true) {
            const runs = await fetchRuns()
            for (const [name, workflowId] of Object.entries(required)) {
              const matches = runs.filter(run => run.workflow_id === workflowId && run.head_sha === process.env.SHA && run.event === 'push')
              matches.sort((a, b) => Date.parse(b.created_at) - Date.parse(a.created_at) || b.run_number - a.run_number)
              const latest = matches[0]
              if (!latest) {
                passed.delete(name)
                console.log(name + ': waiting for exact-SHA workflow run')
                continue
              }
              if (latest.status === 'completed') {
                if (latest.conclusion !== 'success') {
                  console.error(name + ' failed for ' + process.env.SHA + ': ' + latest.conclusion + ' (' + latest.html_url + ')')
                  process.exit(1)
                }
                passed.set(name, latest.html_url)
                console.log(name + ' success: ' + latest.html_url)
              } else {
                passed.delete(name)
                console.log(name + ' status ' + latest.status + ': waiting')
              }
            }
            if (passed.size === Object.keys(required).length) {
              console.log('Exact commit passed CI and QA. Deployment may proceed.')
              break
            }
            if (Date.now() >= deadline) {
              console.error('Timed out waiting for same-SHA CI and QA; deployment is blocked.')
              process.exit(1)
            }
            await new Promise(resolve => setTimeout(resolve, 30000))
          }
          NODE

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: [build, verify]
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
