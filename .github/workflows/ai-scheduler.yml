name: MobilyaCAD 5 Dakikalık Ajan Zamanlayıcısı

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  actions: write
  contents: read

concurrency:
  group: mobilyacad-five-minute-scheduler
  cancel-in-progress: true

jobs:
  dispatch-development-agent:
    name: Boşta ise dev ajanını başlat
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Varsayılan dal güvenlik kontrolü
        shell: bash
        run: |
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "::error::Zamanlayıcı yalnızca main üzerindeki yapılandırma dosyasından çalışmalıdır."
            exit 1
          fi

      - name: Aktif geliştirme çalışmasını kontrol et ve gerekirse dev dalına gönder
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail

          API="https://api.github.com/repos/$REPOSITORY/actions/workflows/ai-developer.yml/runs"
          HEADERS=(-H "Accept: application/vnd.github+json" -H "Authorization: Bearer $GH_TOKEN" -H "X-GitHub-Api-Version: 2022-11-28")

          for STATUS in queued in_progress; do
            RESPONSE=$(curl --fail --silent --show-error "${HEADERS[@]}" "$API?branch=dev%2Fgithub-work&status=$STATUS&per_page=1")
            COUNT=$(printf '%s' "$RESPONSE" | jq '.total_count // 0')
            if [ "$COUNT" -gt 0 ]; then
              echo "Geliştirme ajanı zaten $STATUS durumunda. Yeni çalışma başlatılmadı."
              exit 0
            fi
          done

          TASK=$(cat <<'TASK_EOF'
          FIVE-MINUTE COORDINATION TICK:
          Read AI_COORDINATION.md first, then inspect the current dev/github-work HEAD,
          open feature PRs and recent Actions results. This scheduled run must respect the
          ownership boundaries recorded in AI_COORDINATION.md:
          - UI agent owns frontend/**.
          - Product agent owns non-frontend domain/engine/production calculations/tests/docs/CI.
          - QA agent is read-only.
          Do not edit, overwrite, cherry-pick, or commit files owned by another agent.
          Do not modify main. Work only on dev/github-work.
          Select a small, verifiably unclaimed task only if the board and open PRs show that
          no other agent owns or is already implementing it. If no safe unclaimed task exists,
          perform a read-only integration review and report the precise blocker; do not invent
          work or create a no-op commit. Never weaken tests or claim checks passed without
          actual Actions evidence. Do not merge PRs in this scheduled tick.
          TASK_EOF
          )

          PAYLOAD=$(jq -n --arg ref "dev/github-work" --arg task "$TASK" '{ref: $ref, inputs: {task: $task}}')
          curl --fail --silent --show-error -X POST "${HEADERS[@]}" \
            -H "Content-Type: application/json" \
            -d "$PAYLOAD" \
            "https://api.github.com/repos/$REPOSITORY/actions/workflows/ai-developer.yml/dispatches"

          echo "AI Developer workflow dev/github-work dalında tetiklendi."
